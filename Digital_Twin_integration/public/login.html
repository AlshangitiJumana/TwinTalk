<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; background-color: #f5f5f5;
    }
    .header {
      width: 100%; height: 50px; background-color: #d4ecff;
      display: flex; align-items: center; justify-content: center;
      padding: 10px; position: absolute; top: 0; left: 0;
    }
    .container {
      width: 400px; padding: 2rem; border-radius: 8px;
      background: white; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .logo { width: 130px; display: block; margin: 0 auto 10px; }
    h2 { font-size: 24px; margin-bottom: 5px; }
    p { color: #555; margin-bottom: 20px; }
    .input-box {
      position: relative; margin-bottom: 15px;
    }
    .input-box input {
      width: 100%; padding: 12px; padding-left: 35px;
      border: 1px solid #ccc; border-radius: 5px; font-size: 14px;
    }
    .input-box img {
      width: 16px; position: absolute; left: 10px;
      top: 50%; transform: translateY(-50%);
    }
    .options {
      display: flex; justify-content: space-between;
      font-size: 14px; margin-bottom: 15px;
    }
    .forgot-password {
      text-decoration: none; color: #1f6cab; font-weight: bold;
    }
    .login-btn {
      width: 100%; background-color: #d4ecff; color: black;
      padding: 12px; border: none; border-radius: 5px;
      font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px;
    }
    #error-message {
      color: red; font-size: 14px; margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="header"><h3>Welcome</h3></div>

  <div class="container">
    <img src="logo.png" alt="TwinTalk Logo" class="logo">
    <div class="login-box">
      <h2>Login</h2>
      <p>Sign in to continue.</p>
      <form onsubmit="return handleLogin(event)">
        <div class="input-box">
          <img src="user-icon.png" alt="User Icon">
          <input type="text" id="username" placeholder="Username" required>
        </div>
        <div class="input-box">
          <img src="lock-icon.png" alt="Lock Icon">
          <input type="password" id="password" placeholder="Password" required>
        </div>
        <div class="options">
          <label><input type="checkbox"> Remember Me</label>
          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>
        <button type="submit" class="login-btn">LOGIN</button>
        <p id="error-message"></p>
      </form>
    </div>
  </div>

  <script>
    function handleLogin(event) {
  event.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const errorMsg = document.getElementById('error-message');

  if (username === 'Maryam' && password === '1234') {
    localStorage.setItem('isLoggedIn', 'true');
    localStorage.setItem('userName', username); //  Store the username
    window.location.href = '/';
  } else {
    errorMsg.textContent = 'Invalid username or password.';
  }
}

  </script>
</body>
</html>
